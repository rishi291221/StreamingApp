apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: {{ .Values.namespace }}

spec:
  replicas: {{ .Values.admin.replicaCount }}

  selector:
    matchLabels:
      app: admin

  template:
    metadata:
      labels:
        app: admin

    spec:
      containers:
      - name: admin

        image: "{{ .Values.accountId }}.dkr.ecr.{{ .Values.region }}.amazonaws.com/{{ .Values.admin.image }}:{{ .Values.admin.tag }}"

        
        env:
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: mongodb-secret
              key: MONGO_URI

        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: auth-jwt-secret
              key: JWT_SECRET

        - name: CLIENT_URLS
          value: {{ .Values.frontendOrigin | quote }}

        - name: AWS_S3_BUCKET
          value: {{ .Values.awsS3Bucket | quote }}

        - name: AWS_REGION
          value: {{ .Values.awsRegion | default "us-east-1" | quote }}


        ports:
        - containerPort: {{ .Values.admin.port }}

---
apiVersion: v1
kind: Service
metadata:
  name: admin-service
  namespace: {{ .Values.namespace }}

spec:
  selector:
    app: admin

  ports:
  - port: {{ .Values.admin.port }}
    targetPort: {{ .Values.admin.port }}

  type: ClusterIP
